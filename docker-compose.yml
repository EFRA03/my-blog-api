services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: my_blog_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql   # ✅ correcto para 18+
    # - ./postgres_data:/var/lib/postgresql/data # válido para versiones anteriores

  # Opcional: pgAdmin para la gestión de bases de datos
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@myblog.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: